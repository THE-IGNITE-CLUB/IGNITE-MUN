services:
  - type: web
    name: ignite-mun-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: GMAIL_USERNAME
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: FREE_SLOTS
        value: "10"
      - key: CONFERENCE_DATE
        value: "2026-12-01T07:00:00+05:30"
      - key: FRONTEND_URL
        value: "https://the-ignite-club.github.io/IGNITE-MUN"
      - key: BACKEND_URL
        value: "https://i-mun.onrender.com"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
    healthCheckPath: /api/stats
